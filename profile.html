<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record · Registry</title>
<meta name="description" content="View a saved registration record.">
<meta name="theme-color" content="#f6f4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2314171f'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23f6f4ef'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="index.html">Registry <small>Lab 8</small></a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Register</a></li>
      <li><a href="profile.html" aria-current="page">Latest record</a></li>
      <li><a href="entries.html">All records</a></li>
    </ul></nav>
  </div>
</header>
<main id="main" class="wrap">
  <article id="profile">
    <p class="notice" role="status" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      Record saved. Here is what we stored.
    </p>
    <header class="record-head">
      <p class="eyebrow"></p>
      <h1></h1>
      <p class="sub"></p>
    </header>
    <dl class="record"></dl>
    <div class="record-actions">
      <div class="group">
        <a class="btn btn-primary" href="index.html">Register another person</a>
        <a class="btn btn-secondary" href="entries.html">See all records</a>
      </div>
      <button id="printBtn" type="button" class="btn-text">Print this record</button>
    </div>
    <nav class="pager" aria-label="Records"></nav>
  </article>
  <template id="emptyTpl">
    <div class="record-head">
      <p class="eyebrow">No records yet</p>
      <h1>Nothing to show</h1>
      <p class="sub">Records appear here after you complete the registration form.</p>
    </div>
    <div class="record-actions"><a class="btn btn-primary" href="index.html">Start registration</a></div>
  </template>
</main>
<footer><div class="wrap"><span>Records are kept in this browser only (localStorage). Nothing is sent to a server.</span><span>Lab 8 · Web Technologies</span></div></footer>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
